<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LungNote Admin — All Pages Preview</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --accent: #a23b2a; --bg: #fdf8f6; --surface: #fff; --border: #f0ddd8; --muted: #8a6e64; --fg: #3a2018; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font: 400 14px/1.6 'Inter', system-ui, sans-serif; padding: 40px 24px; }
    h1 { font-size: 28px; font-weight: 700; text-align: center; margin-bottom: 4px; }
    h1 span { color: var(--accent); }
    .sub { text-align: center; font-size: 14px; color: var(--muted); margin-bottom: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(480px, 1fr)); gap: 32px; max-width: 1400px; margin: 0 auto; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(162,59,42,.04); }
    .card-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .card-title { font-size: 14px; font-weight: 600; }
    .card-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 3px 8px; border-radius: 4px; }
    .card-badge.page { background: var(--accent); color: #fff; }
    .card-badge.route { background: var(--bg); color: var(--muted); border: 1px solid var(--border); font-family: 'JetBrains Mono', monospace; }
    .card-frame { width: 100%; height: 520px; border: none; }
    .card-frame.tall { height: 680px; }
  </style>
</head>
<body>

<h1>LungNote <span>Admin</span> — Pages</h1>
<p class="sub">3 pages + shell layout — desktop-first, red theme</p>

<div class="grid">
  <div class="card">
    <div class="card-header">
      <span class="card-title">Login</span>
      <div style="display:flex;gap:6px;">
        <span class="card-badge page">Page</span>
        <span class="card-badge route">/admin/login</span>
      </div>
    </div>
    <iframe class="card-frame" src="login.html"></iframe>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Traces List</span>
      <div style="display:flex;gap:6px;">
        <span class="card-badge page">Page</span>
        <span class="card-badge route">/admin/traces</span>
      </div>
    </div>
    <iframe class="card-frame tall" src="traces-list.html"></iframe>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Trace Detail</span>
      <div style="display:flex;gap:6px;">
        <span class="card-badge page">Page</span>
        <span class="card-badge route">/admin/traces/[id]</span>
      </div>
    </div>
    <iframe class="card-frame tall" src="traces-detail.html"></iframe>
  </div>

  <div class="card">
    <div class="card-header">
      <span class="card-title">Shell Layout</span>
      <div style="display:flex;gap:6px;">
        <span class="card-badge page">Component</span>
        <span class="card-badge route">sidebar + topbar</span>
      </div>
    </div>
    <iframe class="card-frame" src="admin-shell.html"></iframe>
  </div>
</div>

</body>
</html>
