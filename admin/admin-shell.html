<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LungNote Admin — Shell</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fdf8f6;
      --surface: #fff;
      --border: #f0ddd8;
      --muted: #8a6e64;
      --fg: #3a2018;
      --accent: #a23b2a;
      --accent-light: #f5e0dc;
      --accent-hover: #8a2e20;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--fg); font: 400 14px/1.6 var(--font-body); }

    /* Shell */
    .shell { display: grid; grid-template-columns: 240px 1fr; grid-template-rows: 56px 1fr; min-height: 100vh; }

    /* Topbar */
    .topbar {
      grid-column: 1 / -1; position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border);
      height: 56px;
    }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .topbar-brand { font-size: 15px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 6px; }
    .topbar-brand .admin-badge { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; background: var(--accent); color: #fff; padding: 2px 6px; border-radius: 3px; }
    .topbar-title { font-size: 14px; color: var(--muted); margin-left: 16px; padding-left: 16px; border-left: 1px solid var(--border); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-user { font-size: 13px; color: var(--muted); }
    .btn-logout { font-size: 13px; font-weight: 500; color: var(--accent); background: none; border: 1px solid var(--accent); padding: 5px 12px; border-radius: 4px; cursor: pointer; transition: background .15s; }
    .btn-logout:hover { background: var(--accent-light); }
    .mobile-menu { display: none; width: 36px; height: 36px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); align-items: center; justify-content: center; cursor: pointer; }
    .mobile-menu svg { width: 20px; height: 20px; color: var(--fg); }

    /* Sidebar */
    .sidebar {
      background: var(--surface); border-right: 1px solid var(--border);
      padding: 20px 16px; display: flex; flex-direction: column; gap: 4px;
      overflow-y: auto;
    }
    .nav-section { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 16px 12px 6px; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 6px; font-size: 14px; font-weight: 500;
      color: var(--muted); text-decoration: none; cursor: pointer; transition: all .15s;
      border: none; background: none; width: 100%; text-align: left;
    }
    .nav-item:hover { background: var(--bg); color: var(--fg); }
    .nav-item.active { background: var(--accent-light); color: var(--accent); font-weight: 600; }
    .nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
    .nav-item .badge { margin-left: auto; font-size: 11px; font-weight: 600; background: var(--accent); color: #fff; padding: 1px 6px; border-radius: 10px; }

    /* Main content */
    .main { padding: 32px; overflow-y: auto; }
    .main-inner { max-width: 1200px; margin: 0 auto; }

    /* Responsive */
    @media (max-width: 1023px) {
      .shell { grid-template-columns: 1fr; }
      .sidebar { display: none; position: fixed; left: 0; top: 56px; bottom: 0; width: 260px; z-index: 40; box-shadow: 4px 0 20px rgba(0,0,0,.1); }
      .sidebar.open { display: flex; }
      .mobile-menu { display: flex; }
      .main { padding: 20px 16px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <!-- Topbar -->
  <header class="topbar">
    <div class="topbar-left">
      <button class="mobile-menu" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="topbar-brand">
        LungNote <span class="admin-badge">Admin</span>
      </div>
      <span class="topbar-title">Traces</span>
    </div>
    <div class="topbar-right">
      <span class="topbar-user">admin@lungnote.app</span>
      <button class="btn-logout">Logout</button>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <span class="nav-section">Monitoring</span>
    <button class="nav-item active">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      Traces
      <span class="badge">24</span>
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      Errors
      <span class="badge">3</span>
    </button>
    <span class="nav-section">System</span>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>
      Users
    </button>
    <button class="nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      Settings
    </button>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="main-inner">
      <p style="color:var(--muted);font-size:16px;text-align:center;padding:80px 0;">Page content goes here</p>
    </div>
  </main>
</div>

<script>
  const menuBtn = document.getElementById('menuBtn');
  const sidebar = document.getElementById('sidebar');
  menuBtn?.addEventListener('click', () => sidebar.classList.toggle('open'));
</script>
</body>
</html>
