<svg xmlns="http://www.w3.org/2000/svg" width="2500" height="1686" viewBox="0 0 2500 1686">
  <defs>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6aab8e" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6aab8e" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="leftPanelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a3328"/>
      <stop offset="100%" stop-color="#1e1e1c"/>
    </linearGradient>
  </defs>

  <!-- ═══ Full dark background ═══ -->
  <rect width="2500" height="1686" fill="#1e1e1c"/>

  <!-- ═══ LEFT PANEL — Brand / CTA (col 1, spans full height) ═══ -->
  <rect x="24" y="24" width="785" height="1638" rx="24" fill="url(#leftPanelGrad)"/>
  <!-- Subtle border -->
  <rect x="24" y="24" width="785" height="1638" rx="24" fill="none" stroke="#6aab8e" stroke-width="2" opacity="0.3"/>

  <!-- Decorative notebook lines in left panel -->
  <g opacity="0.08" stroke="#6aab8e" stroke-width="1">
    <line x1="60" y1="300" x2="770" y2="300"/>
    <line x1="60" y1="360" x2="770" y2="360"/>
    <line x1="60" y1="420" x2="770" y2="420"/>
    <line x1="60" y1="480" x2="770" y2="480"/>
    <line x1="60" y1="540" x2="770" y2="540"/>
  </g>

  <!-- LungNote Logo (checkbox icon) -->
  <g transform="translate(316, 280)">
    <rect x="0" y="0" width="200" height="200" rx="20" stroke="#6aab8e" stroke-width="7" fill="none"/>
    <path d="M50,100 L80,135 L155,55" stroke="#6aab8e" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- LungNote text -->
  <text x="416" y="560" font-family="'Caveat', 'Sarabun', cursive" font-size="80" font-weight="700" fill="#e8e6e0" text-anchor="middle">LungNote</text>

  <!-- Decorative small notebook preview -->
  <g transform="translate(200, 620)" opacity="0.6">
    <!-- Mini notebook -->
    <rect x="0" y="0" width="430" height="340" rx="16" fill="#2a2a28" stroke="#3a3835" stroke-width="2"/>
    <!-- Spiral holes -->
    <g fill="#1e1e1c" stroke="#3a3835" stroke-width="2">
      <circle cx="60" cy="30" r="10"/>
      <circle cx="60" cy="80" r="10"/>
      <circle cx="60" cy="130" r="10"/>
      <circle cx="60" cy="180" r="10"/>
      <circle cx="60" cy="230" r="10"/>
      <circle cx="60" cy="280" r="10"/>
    </g>
    <!-- Lines + todo items -->
    <g font-family="'Caveat', cursive" font-size="36" fill="#e8e6e0">
      <text x="95" y="55">☑ อ่านบท 5 ฟิสิกส์</text>
      <text x="95" y="110">☑ ส่งรายงานกลุ่ม</text>
      <text x="95" y="165" fill="#6aab8e">☐ ทบทวนศัพท์</text>
      <text x="95" y="220" fill="#6aab8e">☐ เตรียมพรีเซนต์</text>
    </g>
    <!-- Ruled lines -->
    <g opacity="0.15" stroke="#6aab8e" stroke-width="1">
      <line x1="90" y1="65" x2="410" y2="65"/>
      <line x1="90" y1="120" x2="410" y2="120"/>
      <line x1="90" y1="175" x2="410" y2="175"/>
      <line x1="90" y1="230" x2="410" y2="230"/>
      <line x1="90" y1="285" x2="410" y2="285"/>
    </g>
  </g>

  <!-- Tagline -->
  <text x="416" y="1060" font-family="'Sarabun', sans-serif" font-size="42" font-weight="400" fill="#8a8578" text-anchor="middle">จดโน้ต เช็คลิสต์ จัดระเบียบ</text>

  <!-- CTA Button -->
  <rect x="156" y="1120" width="520" height="100" rx="16" fill="#6aab8e"/>
  <text x="416" y="1190" font-family="'Caveat', cursive" font-size="52" font-weight="700" fill="#fffef9" text-anchor="middle">เริ่มจดเลย</text>

  <!-- Subtext -->
  <text x="416" y="1290" font-family="'Sarabun', sans-serif" font-size="34" font-weight="400" fill="#5a5750" text-anchor="middle">(ไม่มีค่าใช้จ่าย)</text>

  <!-- ═══ RIGHT CELLS (2×2 grid) ═══ -->
  <!-- Cell padding: 24px gap, cells start at x=833 -->

  <!-- ── Cell: Dashboard (top-left) ── -->
  <rect x="833" y="24" width="809" height="795" rx="24" fill="#2a2a28"/>
  <!-- Badge -->
  <rect x="1100" y="50" width="120" height="48" rx="24" fill="#6aab8e"/>
  <text x="1160" y="83" font-family="'Sarabun', sans-serif" font-size="28" font-weight="600" fill="#fffef9" text-anchor="middle">หน้าหลัก</text>
  <!-- Dashboard icon (4 squares) -->
  <g transform="translate(1140, 260)">
    <rect x="0" y="0" width="80" height="80" rx="10" stroke="#e8e6e0" stroke-width="5" fill="none"/>
    <rect x="100" y="0" width="80" height="80" rx="10" stroke="#e8e6e0" stroke-width="5" fill="none"/>
    <rect x="0" y="100" width="80" height="80" rx="10" stroke="#e8e6e0" stroke-width="5" fill="none"/>
    <rect x="100" y="100" width="80" height="80" rx="10" stroke="#e8e6e0" stroke-width="5" fill="none"/>
  </g>
  <!-- Label -->
  <text x="1238" y="620" font-family="'Caveat', cursive" font-size="60" font-weight="700" fill="#e8e6e0" text-anchor="middle">Dashboard</text>
  <text x="1238" y="680" font-family="'Sarabun', sans-serif" font-size="36" font-weight="400" fill="#5a5750" text-anchor="middle">ภาพรวมโน้ตของคุณ</text>

  <!-- ── Cell: Notes (top-right) ── -->
  <rect x="1666" y="24" width="810" height="795" rx="24" fill="#2a2a28"/>
  <!-- Notepad icon with pencil -->
  <g transform="translate(1970, 260)">
    <!-- Notepad -->
    <rect x="0" y="20" width="120" height="160" rx="10" stroke="#e8e6e0" stroke-width="5" fill="none"/>
    <!-- Lines -->
    <line x1="20" y1="65" x2="100" y2="65" stroke="#e8e6e0" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="95" x2="90" y2="95" stroke="#e8e6e0" stroke-width="3" opacity="0.4"/>
    <line x1="20" y1="125" x2="80" y2="125" stroke="#e8e6e0" stroke-width="3" opacity="0.4"/>
    <!-- Pencil -->
    <line x1="105" y1="10" x2="135" y2="-25" stroke="#e8e6e0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="135" cy="-27" r="6" fill="#f0d87a"/>
  </g>
  <!-- Label -->
  <text x="2071" y="620" font-family="'Caveat', cursive" font-size="60" font-weight="700" fill="#e8e6e0" text-anchor="middle">โน้ตของฉัน</text>
  <text x="2071" y="680" font-family="'Sarabun', sans-serif" font-size="36" font-weight="400" fill="#5a5750" text-anchor="middle">เปิดดูโน้ตทั้งหมด</text>

  <!-- ── Cell: Help (bottom-left) ── -->
  <rect x="833" y="843" width="809" height="819" rx="24" fill="#2a2a28"/>
  <!-- Badge -->
  <rect x="1080" y="870" width="120" height="48" rx="24" fill="#e8a946"/>
  <text x="1140" y="903" font-family="'Sarabun', sans-serif" font-size="28" font-weight="600" fill="#fffef9" text-anchor="middle">ช่วยเหลือ</text>
  <!-- Help icon (? in circle) -->
  <g transform="translate(1238, 1120)">
    <circle cx="0" cy="0" r="80" stroke="#e8e6e0" stroke-width="5" fill="none"/>
    <text x="0" y="28" font-family="'Caveat', cursive" font-size="100" font-weight="700" fill="#e8e6e0" text-anchor="middle">?</text>
  </g>
  <!-- Label -->
  <text x="1238" y="1380" font-family="'Caveat', cursive" font-size="60" font-weight="700" fill="#e8e6e0" text-anchor="middle">Help</text>
  <text x="1238" y="1440" font-family="'Sarabun', sans-serif" font-size="36" font-weight="400" fill="#5a5750" text-anchor="middle">วิธีใช้และคำถาม</text>

  <!-- ── Cell: Settings (bottom-right) ── -->
  <rect x="1666" y="843" width="810" height="819" rx="24" fill="#2a2a28"/>
  <!-- Badge -->
  <rect x="1930" y="870" width="80" height="48" rx="24" fill="#6aab8e" opacity="0.7"/>
  <text x="1970" y="903" font-family="'Sarabun', sans-serif" font-size="26" font-weight="600" fill="#fffef9" text-anchor="middle">ใหม่</text>
  <!-- Settings icon (gear) -->
  <g transform="translate(2071, 1120)">
    <circle cx="0" cy="0" r="35" stroke="#e8e6e0" stroke-width="5" fill="none"/>
    <circle cx="0" cy="0" r="70" stroke="#e8e6e0" stroke-width="4" fill="none" stroke-dasharray="22 15"/>
  </g>
  <!-- Label -->
  <text x="2071" y="1380" font-family="'Caveat', cursive" font-size="60" font-weight="700" fill="#e8e6e0" text-anchor="middle">ตั้งค่า</text>
  <text x="2071" y="1440" font-family="'Sarabun', sans-serif" font-size="36" font-weight="400" fill="#5a5750" text-anchor="middle">จัดการบัญชี</text>

  <!-- ═══ Subtle decorations ═══ -->
  <!-- Star doodle top-right corner -->
  <g opacity="0.15" transform="translate(2380, 50)">
    <path d="M0,-15 L4,-4 L15,-4 L6,3 L9,15 L0,8 L-9,15 L-6,3 L-15,-4 L-4,-4 Z" stroke="#6aab8e" stroke-width="2" fill="none"/>
  </g>
  <!-- Circle doodle -->
  <g opacity="0.12" transform="translate(870, 1630)">
    <circle cx="0" cy="0" r="20" stroke="#6aab8e" stroke-width="2" fill="none"/>
  </g>
</svg>